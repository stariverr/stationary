name: Build & Deploy (GitOps)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/k8s/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Unified Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stationary
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.short_sha }}

      - name: Build and Push Unified Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Update GitOps Manifests
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update Image Tag in Kustomize
        env:
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cd deploy/k8s/overlays/production
          kustomize edit set image ghcr.io/stariverr/stationary=ghcr.io/${OWNER}/stationary:${SHORT_SHA}

      - name: Commit and Push GitOps changes
        env:
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/production/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No image changes detected in kustomization.yaml"
          else
            git commit -m "ci(gitops): deploy ${SHORT_SHA} [skip ci]"
            git push origin main
          fi
