# Copy this file to a safe location or manage it via SealedSecrets / ExternalSecrets / Doppler.
# Do NOT commit actual plaintext secrets to public Git repositories.
apiVersion: v1
kind: Secret
metadata:
  name: stationary-secrets
  namespace: stationary
type: Opaque
stringData:
  # External PostgreSQL URL (e.g. Supabase, Neon, AWS RDS, external VM)
  DB_URL: "postgresql://postgres:your-db-password@your-external-db-host:5432/stationary"
  # External Redis URL
  REDIS_URL: "redis://your-external-redis-host:6379"
  # Backend Auth Secret (min 32 chars)
  AUTH_SECRET: "change-me-random-auth-secret-min-32-chars"
  # Resend Email API
  RESEND_API_KEY: "re_your_resend_api_key"
  RESEND_EMAIL_SENDER: "noreply@yourdomain.com"
  # S3-compatible Object Storage
  S3_ENDPOINT: "https://<account-id>.r2.cloudflarestorage.com"
  S3_ACCESS_KEY_ID: "your-s3-access-key-id"
  S3_SECRET_ACCESS_KEY: "your-s3-secret-access-key"
  S3_BUCKET: "stationary"
  CDN_BASE_URL: "https://your.cdn.base.url"
  # Optional fields
  TIKHUB_API_BASE_URL: ""
  TIKHUB_API_KEY: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
  TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
