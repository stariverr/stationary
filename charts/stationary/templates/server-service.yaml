apiVersion: v1
kind: Service
metadata:
  name: {{ include "stationary.fullname" . }}-server
  labels:
    {{- include "stationary.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "stationary.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
