apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stationary.fullname" . }}-server
  labels:
    {{- include "stationary.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "stationary.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stationary.componentLabels" (dict "root" . "component" "server") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      containers:
        - name: server
          image: {{ printf "%s:%s" .Values.server.image.repository (include "stationary.imageTag" (dict "root" . "image" .Values.server.image)) | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9400
          env:
            - name: SERVER_ROLE
              value: api
            - name: DB_POOL_MAX
              value: {{ .Values.server.dbPoolMax | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "stationary.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecretName }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.server.tmpVolumeSizeLimit }}
